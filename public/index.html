<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Map</title>
    <link href="compiled/app.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <style>
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- location search -->
    
    <div id="search-container">
        <div id="search" class="trans">
            <input type="text" id="search-input" placeholder="Search ...">
            <img src="assets/icons/location.svg">
        </div>

        <div id="search-results"></div>
    </div>

    <!-- quick layer selector -->

    <div id="toprow">
        <div id="quick-controls" class="trans"></div>
    </div>

    <footer> <!-- style as grid w notebook taking 2 rows -->

        <!-- notebook (main product selector) -->

        <div id="notebook" class="trans">
            <button id="notebook-dropdown" class="trans" popovertarget="notebook-options">
                <span id="notebook-label"></span>
                <img src="assets/icons/dropdown.svg">
            </button>
            <div id="notebook-options" popover></div>
        </div>

        <!-- timeline -->

        <div id="timeline" class="trans bubble">
            
            <div id="outlook-controls" style="display: none;"></div>

        </div>

        <img src="assets/guide-test.png" id="color-guide">

    </footer>

    <script src="compiled/app.js" type="module"></script>
</body>
</html>
